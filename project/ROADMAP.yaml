      excerpt: Collections/export are paginated with size <=100 and stable ordering.
        Queries require bounded bbox and limit <=100 and report truncation. Errors
        are RFC 9457 Problem Details with UUID correlation IDs. Geometry and layer
        revisions reject stale PUTs. Inline block history is capped at 1000 versions
        with an explicit 422 rather than silent truncation.
