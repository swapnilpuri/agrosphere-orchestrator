      modified_at: '2026-10-24T05:17:40.994104+00:00'
      line: 60
      excerpt: 'Consumed on durable agrosphere.domain topic bindings: EstateCreated,
        EstateUpdated, PlantationBlockCreated, PlantationBlockUpdated, all version
        2. Full pinned JSON Schema and format checks run before mutation; envelope/payload
        IDs and routing keys must agree. Consumer idempotency and projection share
        a transaction. Newer entity revision wins, including update-before-create;
        stale/duplicate delivery cannot overwrite newer state. Three bounded retries
        end in spatial.estate.v2.dead via spatial.dead; ACK follows committed effects.'
      outcome: null
