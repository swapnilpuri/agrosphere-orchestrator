      modified_at: '2026-10-24T19:41:04.786455+00:00'
      line: 62
      excerpt: Operations delegates the authenticated bearer token to the real Estate
        GET estate/block APIs, using bounded timeouts, no redirects, canonical timezone,
        active RUBBER ownership checks and explicit denial/unavailability mapping.
        No external database access or fabricated success fallback exists. Estate
        operational roles receive scoped master-data reads only; existing master-data
        write permissions remain enforced.
      outcome: null
