    - repository: agrosphere-architecture
      path: docs/milestones/milestone-3a-completion.md
      kind: document
      sha256: ff43513d59585b92ad082372fda96d83b7dc4901dd94f6d53cd135a70f027737
      head: ab6289d42dcc0ba4a956c39ed55b34c2f0c49746
      modified_at: '2026-10-24T19:41:04.786455+00:00'
      line: 56
      excerpt: 'Domain changes and outbox insert share one local transaction. A scheduled
        relay locks committed due rows with SKIP LOCKED, sends persistent mandatory
        messages, waits for positive confirms/no returns, and marks publication only
        afterward. Bounded exponential retries retain failed rows and stable IDs.
        Broker acknowledgment followed by database failure can redeliver: consumers
        must atomically deduplicate eventId. Backlog/failure gauges, health/readiness,
        bounded pooling and graceful shutdown are configured.'
      outcome: null
