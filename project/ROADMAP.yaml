      excerpt: Integration covers all sixteen REST operations, duplicate estate/division/block/clone
        codes, request errors, estate filtering, viewer write denial, wrong estate/audience/issuer,
        expired/forged JWTs, actual JPA optimistic conflicts, parent mismatch/composite
        FK enforcement, fresh migrations and V1 upgrade, atomic domain/outbox rollback,
        real confirmed RabbitMQ delivery, same-eventId redelivery, health/readiness/liveness
        and generated OpenAPI. Unit messaging tests include retry caps, failure retention,
        nacks and unroutable acknowledged messages.
      outcome: null
