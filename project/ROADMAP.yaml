    - 'agrosphere-architecture/docs/milestones/milestone-3a-completion.md:60: Issuer/audience/cryptographic
      JWT validation follows the existing platform. Roles and trusted estate_ids are
      enforced inside Operations for individual objects and collection queries. PLATFORM_ADMIN/PLANTATION_ADMIN
      are global; ESTATE_ADMIN/ESTATE_MANAGER manage scoped schedules and assignments;
      FIELD_SUPERVISOR manages scoped assignments; FIELD_WORKER executes only own
      scoped assignments using signed sub; AUDITOR/VIEWER read only. Additional read
      roles do not remove a worker''s own execution permission or grant writes to
      others.'
    - 'agrosphere-architecture/docs/milestones/milestone-3a-completion.md:62: Operations
      delegates the authenticated bearer token to the real Estate GET estate/block
      APIs, using bounded timeouts, no redirects, canonical timezone, active RUBBER
      ownership checks and explicit denial/unavailability mapping. No external database
      access or fabricated success fallback exists. Estate operational roles receive
      scoped master-data reads only; existing master-data write permissions remain
      enforced.'
