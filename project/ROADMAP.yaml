    - repository: agrosphere-architecture
      path: docs/architecture/INTEGRATION_PATTERNS.md
      kind: document
      sha256: 7678be84c56aaa0baa10fb53e7a233b3051ec9758403172c633d15a0da32c0f5
      head: ab6289d42dcc0ba4a956c39ed55b34c2f0c49746
      modified_at: '2026-10-24T05:46:53.072185+00:00'
      line: 10
      excerpt: 'Outbox algorithm: domain mutation and serialized event are written
        in one local database transaction. A service-owned relay locks batches (FOR
        UPDATE SKIP LOCKED), publishes persistent messages with publisher confirms
        and only then sets published_at. Confirm/crash ambiguity creates duplicates,
        handled by consumers. Keep eventId stable across retries; partition/order
        by aggregate only where required and use revisions for stale updates. Acknowledge
        delivery after durable effects. TTL/retention, relay leases, retry budgets
        and replay tooling must be specified and tested with first handlers. M0 provides
        tables/design only, not working consumption or relays.'
      outcome: null
