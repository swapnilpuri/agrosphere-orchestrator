      modified_at: '2026-10-24T04:16:32.259642+00:00'
      line: 30
      excerpt: 'Documented decisions: divisions/blocks cannot change estate, blocks
        may change division within that estate; parent inactivation does not cascade;
        historical inactive clones remain referenceable; future planting dates are
        permitted for planning. Inactive blocks return false for operational eligibility;
        downstream enforcement is documented without introducing operational transactions.
        Clone catalog entries have only the requested fields and no update/delete
        endpoint.'
