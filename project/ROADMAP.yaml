      excerpt: 'Explicit indexes: reference_estate_idx; feature_active_entity_uq (partial
        unique WHERE ACTIVE); feature_geometry_gist; feature_estate_reference_idx;
        feature_version_geometry_gist; layer_estate_idx; asset_position_gist; asset_estate_idx;
