        live test clears the details panel, picks a real polygon on the canvas, and
        verifies that its canonical block metadata is retrieved again. Browser suites
        run sequentially to avoid shared port/artifact interference. Synthetic fixtures
        disable Chromium's loopback access check; this is test configuration only.
