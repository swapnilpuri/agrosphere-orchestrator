      modified_at: '2026-10-24T05:17:40.994104+00:00'
      line: 62
      excerpt: 'Produced: SpatialFeatureCreated, SpatialFeatureUpdated, SpatialBoundaryChanged,
        SpatialLayerCreated and DigitalTwinAssetRegistered, all version 1 on agrosphere.<EventType>.v1.
        Envelopes contain eventId, type/version, occurredAt, correlationId, sourceService,
        estateId, payload and referenceEntityId/geometryVersion where applicable.
        They carry feature/layer/asset references instead of geometry blobs. Outbox
        and domain changes are atomic. Mandatory persistent publication, confirms,
        SKIP LOCKED, backoff and retained FAILED records provide bounded at-least-once
        delivery; downstream deduplication is required. README documents reviewed
        replay procedures.'
      outcome: null
