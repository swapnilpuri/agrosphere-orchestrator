        indexes additionally enforce feature IDs/codes, layer/asset estate codes,
        reference identity and history versions. Geometry checks enforce SRID/type/dimensions/validity/ranges.
        Feature-to-reference, history-to-feature and asset-to-feature foreign keys
        exist only inside this database. There are no Estate Service database foreign
        keys, queries or persistence dependencies.'
