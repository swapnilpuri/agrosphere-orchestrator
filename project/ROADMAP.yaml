    objectives:
    - 'agrosphere-architecture/README.md:24: Milestone 1A estate implementation is
      recorded in docs/adr/0008-estate-management.md and docs/roadmap/MILESTONE_1A.md.
      Milestone 1B is recorded separately in ADR-0009.'
    - 'agrosphere-architecture/README.md:26: Requested Milestone 1B spatial implementation
      is recorded in docs/adr/0009-spatial-digital-twin.md and docs/roadmap/MILESTONE_1B.md.
      Spatial Service targets Java 21 as explicitly requested; Estate retains its
      existing Java 25 build. Milestone 1C local integration is recorded in ADR-0010/0011
      and docs/roadmap/MILESTONE_1C.md.'
    - 'agrosphere-architecture/docs/adr/0009-spatial-digital-twin.md:3: Status: Accepted
      for the requested Milestone 1B implementation'
    - 'agrosphere-architecture/docs/architecture/INTEGRATION_PATTERNS.md:14: Milestone
      1A update: estate publishes EstateCreated, EstateUpdated and PlantationBlockCreated/Updated
      using v2 routing and full entity snapshots (ADR-0008). V1 schemas are preserved;
      other producers remain v1 foundation designs. The estate relay is now implemented
      and container-tested. Spatial implements its v2 consumer in M1B; M1C verifies
      it with the real Estate publisher. V2 requires occurredAt/sourceService and
      retains explicit provenance and UUID identities. Retry budgets, retained FAILED
      records, replay and disabled-publication operation are documented in Estate
      Service README.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONES.md:15: Milestone 1B is authorized
      by its separate request and implemented in Spatial Service; see MILESTONE_1B.md
      and ADR-0009. This does not authorize Milestone 1C.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:3: Implementation resides
      only in agrosphere-estate-service, with coordinated contracts 0.2.0 and ADR-0008.
      No Milestone 1B implementation is included.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1B.md:3: Requested implementation:
      independent Spatial Service 0.2.0; independent contracts 0.3.0. See ADR-0009
      and the spatial repository docs/MILESTONE_1B_REPORT.md for concrete source,
      schema, endpoints, actual test results, run commands and limitations.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1B.md:5: Delivered scope includes
      WGS84 features/history, spheroidal areas, bounded spatial queries, GeoJSON import/export,
      layers/assets, estate v2 projections, spatial v1 events/outbox, estate-scoped
      JWT policy and independent deployment artifacts. All fixtures are SIMULATED
      and require no deployed Estate Service.'
    - 'agrosphere-architecture/docs/roadmap/NEXT_CODEX_PROMPT.md:3: Implement AgroSphere
      Milestone 1B Spatial Service and estate identity projection only. Read affected
      AGENTS.md files, architecture ADR-0008, the completed Estate Service report,
      infrastructure configuration and contracts 0.2.0 first. Preserve independent
      Git roots and service-owned databases. Consume the Estate Service v2 snapshots
      with transactional consumer_name/eventId deduplication, revision-aware updates,
      retry/DLQ/replay and reconciliation. Implement spatial-owned PostGIS geometry
      and RFC 7946 WGS84 API contracts, using canonical estate/block UUIDs without
      cross-database access. Reject new operational use of inactive blocks and label
      synthetic fixtures SIMULATED. Add contract/security/PostGIS integration and
      duplicate/out-of-order event tests. Validate builds, migrations, permissions
      and Docker, document actual results and blockers, and stop after Milestone 1B.
      Do not add operations, telemetry, AI, web/immersive functionality or deploy
      to Azure.'
    - 'agrosphere-contracts/README.md:7: See AGENTS.md for scope and engineering rules.
      Estate Service now defines Milestone 1A business operations; Spatial Service
      defines Milestone 1B; other service APIs remain foundation placeholders. Architecture
      lives in the sibling agrosphere-architecture repository; versioned API/event
      definitions live in agrosphere-contracts. Do not add path dependencies to sibling
      projects.'
    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:7: Estate Service is
      implemented, independently buildable and container-tested. All requested acceptance
      checks completed locally: Java 21 build/tests, PostgreSQL startup, fresh and
      upgrade Flyway migrations, REST APIs, JWT authorization, atomic outbox creation,
      real RabbitMQ publication, Docker image and reproducible instructions. No other
      microservice was implemented, no central infrastructure configuration changed,
      no remote/commit/push/cloud deployment occurred, and Milestone 1B was not started.'
    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:185: Implement AgroSphere
      Milestone 1B Spatial Service and estate identity projection only. Read affected
