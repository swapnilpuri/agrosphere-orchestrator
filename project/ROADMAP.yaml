        Docker socket, TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal and mvn verify
        -Pintegration. Validation dependencies were available in the existing contracts
        virtual environment; system Python lacked openapi-spec-validator, so that
        installed environment was used successfully. Logs are ignored: java21-integration.log,
        docker-build.log, image-smoke-final.log; Maven reports and serialized contract
        evidence are under target/.'
