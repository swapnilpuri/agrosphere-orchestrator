      excerpt: GeoJSON import is a bounded JSON FeatureCollection wrapper, atomically
        validated/persisted in the calling request with a durable job/report. No partial
        features/events survive failed imports. Export preserves feature/reference
        identifiers, geometry versions, provenance, bbox, centroid and calculated
        hectares. 3D Tiles metadata is supported through layers; no renderer, client
        or terrain engine is implemented.
