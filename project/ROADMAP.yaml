      sha256: c07f7755312a53851ad3ad792a0c65f183cab43ba5f7b5f3e695b8a4b80c57ef
      head: 2a7dbda842141fca041510ca79481ea0454eaaf8
      modified_at: '2026-10-24T05:17:40.994104+00:00'
      line: 48
      excerpt: Point queries use ST_Covers (including boundaries); intersection uses
        ST_Intersects; within returns stored geometry covered by the supplied polygon.
        GiST envelope prefilters bound queries. Active block overlaps are compared
        in geography hectares with configurable tolerance. Available polygon parents
        cover children; parent changes cannot strand existing child features. Per-estate
        row locks serialize those checks, and conditional geometryVersion updates
        reject concurrent overwrites. Old snapshots remain accessible through block
        history; no operational/tapping/latex records are read or changed.
      outcome: null
