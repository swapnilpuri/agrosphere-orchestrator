      modified_at: '2026-10-24T05:17:40.994104+00:00'
      line: 46
      excerpt: JTS validates Polygon, MultiPolygon, Point and LineString without repair.
        It rejects malformed/unclosed rings, self-intersections, invalid holes, empty/degenerate
        inputs, unsupported CRS, altitude/nonfinite/out-of-range coordinates and oversized
        coordinate sets. PostGIS stores 4326 geometry, provides envelope/centroid
        and calculates hectares with ST_Area(geometry::geography)/10000. Raw degree-based
        area is never used as hectares. JTS planar area is used only to detect degenerate
        polygons.
      outcome: null
