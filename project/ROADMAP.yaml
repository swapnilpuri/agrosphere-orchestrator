      modified_at: '2026-10-24T04:16:32.259642+00:00'
      line: 38
      excerpt: Domain writes and mandatory outbox inserts share one JPA-managed database
        transaction. The dispatcher locks due rows with SKIP LOCKED and sends persistent
        mandatory messages to durable agrosphere.domain using publisher confirms.
        Returns, nacks and exceptions retry with configurable exponential backoff;
        exhausted events remain FAILED for operator-controlled replay. Publication
        defaults disabled while preserving outbox records. Confirmation/crash ambiguity
        permits duplicates with the same eventId. Consumers must deduplicate consumer_name/eventId
        transactionally, ACK after commit and reject stale revisions. No exactly-once
        delivery is claimed. The implementation follows the [Spring AMQP confirm/return
        API](https://docs.spring.io/spring-amqp/reference/amqp/template.html).
      outcome: null
