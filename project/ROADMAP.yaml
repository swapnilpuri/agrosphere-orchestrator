      excerpt: V1 is unchanged. V2 creates estate, division, plantation_block and
        rubber_clone, and extends outbox_event with delivery status and retry scheduling.
        The existing processed_event idempotency table is retained. Published V1 outbox
        rows remain published after upgrade. All tables/queries are Estate Service-owned;
        there are no cross-service foreign keys, entities, databases or source dependencies.
      outcome: null
