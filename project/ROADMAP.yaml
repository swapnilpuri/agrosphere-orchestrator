        missing objects 404, uniqueness/version conflicts 409, invalid Estate references
        422, unavailable/malformed dependencies 503. Responses carry correlation UUIDs
        and structured problem details. Contracts are pinned independently in Operations
        resources; the validator compares request/response schemas, parameters and
        HTTP operations with runtime OpenAPI.
