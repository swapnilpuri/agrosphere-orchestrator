      modified_at: '2026-10-24T19:41:04.786455+00:00'
      line: 105
      excerpt: 'ADR 0012 defines recurrence, cancellation, UTC/local dates, retry/version
        policies, roles, summary semantics and at-least-once delivery. The intentionally
        bounded recurrence vocabulary is DAILY/EVERY_N_DAYS:n, not arbitrary RFC 5545.
        One schedule occurrence covers one worker/date. Create requests do not promise
        exactly-once replay: reconcile ambiguous responses with list queries. Terminal
        reopening, worker identity provisioning, UI workflows, downstream analytics,
        latex collection and DRC are outside 3A.'
      outcome: null
