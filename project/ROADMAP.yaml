      excerpt: 'Preparation found these differences: foundation pom/ADR-0005 use Java
        25, while the explicit request asks for Java 21; Spatial targets 21 and was
        fully verified on 21. ADR-0008 says Java21 although the working Estate pom/README
        actually use Java25; Estate was left unchanged. M1A is available and publishes
        v2, so Spatial consumes existing v2 contracts rather than incompatible foundation
        v1 events. M1A emits no division lifecycle events: division membership is
        inferred from block snapshots and marked inferred, with authoritative division
        lifecycle deferred to a coordinated future release. Infrastructure already
        provisions the service-owned PostGIS database; no central infrastructure changes
        were needed. ADR-0009 and MILESTONE_1B.md record these decisions.'
