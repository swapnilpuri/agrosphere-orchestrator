        four operational tables, internal assignment/schedule/record/reason foreign
        keys, UUID keys, numeric/status constraints, version/audit fields and filter
        indexes. Schedule/date uniqueness permanently prevents regeneration; a partial
        worker/block/date index prevents duplicate noncancelled work. V2 adds outbox
        retry state/index and preserves existing published history (upgrade test executed).
        Estate/block UUIDs have no cross-service foreign keys.
