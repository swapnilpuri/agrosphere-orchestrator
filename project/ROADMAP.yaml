    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:9: - [x] Domain/security/messaging
      tests and PostgreSQL/RabbitMQ integration checks'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:10: - [x] V1 event preservation
      and additive v2 schemas/OpenAPI'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:11: - [x] Reproducible
      runbook and synthetic example requests'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:12: - [x] Java 21 verification:
      47 tests passed, no skips'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:13: - [x] Docker image
      built successfully; see service completion report'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1A.md:15: Runtime verification
      results and limitations are recorded in the service''s docs/MILESTONE_1A_REPORT.md,
      not inferred from implementation checkboxes. Central infrastructure and all
      other service repositories remain unchanged.'
    - 'agrosphere-contracts/README.md:7: See AGENTS.md for scope and engineering rules.
      Estate Service now defines Milestone 1A business operations; Spatial Service
      defines Milestone 1B; other service APIs remain foundation placeholders. Architecture
      lives in the sibling agrosphere-architecture repository; versioned API/event
      definitions live in agrosphere-contracts. Do not add path dependencies to sibling
      projects.'
    - 'agrosphere-contracts/README.md:17: Consumer transaction: insert (consumer_name,event_id)
      with ON CONFLICT DO NOTHING; apply projection only when inserted, in the same
      transaction; commit before ACK. Publisher writes outbox with domain mutation;
      relay publishes persistent messages with confirms and marks published only after
      confirmation. Duplicates are expected. Bounded retries and DLQ handling are
      required before consumers ship. Estate Service implements its v2 relay in Milestone
      1A; consumer handlers remain separate work. Validate forecast period ordering
      and business semantics in applications as JSON Schema cannot enforce them.'
    - 'agrosphere-contracts/README.md:21: Estate OpenAPI now defines sixteen business
      operations and Problem Details, JWT scope, pagination and optimistic versions.
      Four new self-contained events/v2 snapshot schemas use occurredAt/sourceService,
      canonical estateId/entityId and optional blockId as applicable. Every v1 contract
      remains byte-for-byte preserved. V1 EstateCreated requires companyId, which
      M1A does not own; v2 avoids inventing that identity. V1 block update fields
      cannot express status/count changes. Estate Service publishes only v2; existing
      v1 consumers must explicitly migrate to agrosphere.<EventType>.v2. There is
      no dual publishing.'
    - 'agrosphere-estate-service/AGENTS.md:5: Current scope: Milestone 1A Estate plus
      requested Milestone 1C integration patches only; preserve all existing business
      rules, contracts and persistence ownership.'
    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:7: Estate Service is
      implemented, independently buildable and container-tested. All requested acceptance
      checks completed locally: Java 21 build/tests, PostgreSQL startup, fresh and
      upgrade Flyway migrations, REST APIs, JWT authorization, atomic outbox creation,
      real RabbitMQ publication, Docker image and reproducible instructions. No other
      microservice was implemented, no central infrastructure configuration changed,
      no remote/commit/push/cloud deployment occurred, and Milestone 1B was not started.'
    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:11: ## Implemented APIs'
    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:13: All routes use /api/v1,
      bearer JWTs and JSON. Collections support status, page and size, stable ID ordering
      and SQL-scoped pagination. Creation returns 201; resource commands support validation
      and Problem Details. No physical-delete API exists.'
