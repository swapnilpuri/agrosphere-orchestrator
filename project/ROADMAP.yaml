      excerpt: Division lifecycle cannot be authoritative until Estate contracts expose
        it; existing geometry after lifecycle/membership changes needs reconciliation.
        Imports are synchronous, atomic and capped at 100 features/2 MiB by default;
        no CSV endpoint, background job worker, geometry repair, altitude/vertical
        datum, antimeridian workflow or general projected-polygon transformation is
        included. Explicit CRS conversion supports points in 4326/3857 only. History
        has a documented inline cap, exports require paging, and queries can be truncated
        by explicit limit. Retention, alerting, DLQ operator permissions, reconciliation
        scheduling, publisher lock-timeout sizing, image digest pinning and performance/load
        characterization remain deployment hardening tasks. Synthetic asset URLs intentionally
        do not resolve.
      outcome: null
