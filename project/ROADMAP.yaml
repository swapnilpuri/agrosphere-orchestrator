    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:38: Domain writes and
      mandatory outbox inserts share one JPA-managed database transaction. The dispatcher
      locks due rows with SKIP LOCKED and sends persistent mandatory messages to durable
      agrosphere.domain using publisher confirms. Returns, nacks and exceptions retry
      with configurable exponential backoff; exhausted events remain FAILED for operator-controlled
      replay. Publication defaults disabled while preserving outbox records. Confirmation/crash
      ambiguity permits duplicates with the same eventId. Consumers must deduplicate
      consumer_name/eventId transactionally, ACK after commit and reject stale revisions.
      No exactly-once delivery is claimed. The implementation follows the [Spring
      AMQP confirm/return API](https://docs.spring.io/spring-amqp/reference/amqp/template.html).'
    - 'agrosphere-estate-service/docs/MILESTONE_1A_REPORT.md:42: Business routes are
      authenticated by default. Nimbus validates RS256 signatures, configured issuer,
      lifetime and estate-service audience. Trusted Keycloak-style realm_access.roles
      supplies PLATFORM_ADMIN, ESTATE_ADMIN, ESTATE_MANAGER and VIEWER. Signed, administrator-managed
      estate_ids scopes reads/writes. Client headers or user-editable attributes are
      not treated as grants. PLATFORM_ADMIN alone creates estates/clones and has global
      scope; estate admins/managers write assigned estates; viewers read assigned
      estates. Lists apply scope in SQL before counting/pagination. Only health routes
      are public. No production credentials are hardcoded. See [Spring Security JWT
      validation](https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html)
      and the service runbook.'
