      excerpt: TappingSchedule supports DRAFT/ACTIVE/SUSPENDED/CLOSED and versioned
        edits/lifecycle. TappingAssignment supports PLANNED/IN_PROGRESS/COMPLETED/MISSED/CANCELLED,
        scheduled/ad hoc creation, worker reassignment and explicit transitions. TappingRecord
        stores planned/actual trees, worker/estate/block/date, execution instants,
        notes and recording actor; missed reasons store validated code, remarks and
        authenticated actor. Audit instants are UTC; canonical estate timezone controls
        business dates. No latex weight or DRC exists.
