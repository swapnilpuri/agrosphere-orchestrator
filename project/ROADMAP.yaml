      line: 42
      excerpt: Business routes are authenticated by default. Nimbus validates RS256
        signatures, configured issuer, lifetime and estate-service audience. Trusted
        Keycloak-style realm_access.roles supplies PLATFORM_ADMIN, ESTATE_ADMIN, ESTATE_MANAGER
        and VIEWER. Signed, administrator-managed estate_ids scopes reads/writes.
        Client headers or user-editable attributes are not treated as grants. PLATFORM_ADMIN
        alone creates estates/clones and has global scope; estate admins/managers
        write assigned estates; viewers read assigned estates. Lists apply scope in
        SQL before counting/pagination. Only health routes are public. No production
        credentials are hardcoded. See [Spring Security JWT validation](https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html)
        and the service runbook.
      outcome: null
