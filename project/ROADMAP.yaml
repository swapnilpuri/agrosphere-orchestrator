      line: 60
      excerpt: Issuer/audience/cryptographic JWT validation follows the existing platform.
        Roles and trusted estate_ids are enforced inside Operations for individual
        objects and collection queries. PLATFORM_ADMIN/PLANTATION_ADMIN are global;
        ESTATE_ADMIN/ESTATE_MANAGER manage scoped schedules and assignments; FIELD_SUPERVISOR
        manages scoped assignments; FIELD_WORKER executes only own scoped assignments
        using signed sub; AUDITOR/VIEWER read only. Additional read roles do not remove
        a worker's own execution permission or grant writes to others.
      outcome: null
