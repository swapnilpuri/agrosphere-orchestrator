      excerpt: Only canonical IDs, estate/parent IDs, lifecycle status and snapshot
        revision are retained. M1A emits no division events, so division membership
        is inferred from validated block snapshots and explicitly marked inferred;
        independent division lifecycle cannot be established yet. Estate/block lifecycle
        is authoritative; revisions handle update-before-create and stale delivery.
