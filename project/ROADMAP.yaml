    - repository: agrosphere-estate-service
      path: docs/MILESTONE_1A_REPORT.md
      kind: document
      sha256: de879fb392c8f2d51e27fc97461636bcd1b32a62e9a1cb4747af69ecb58ba826
      head: 7fdd691431a6962f5ac71fb08e9e3e09380bae00
      modified_at: '2026-10-24T04:16:32.259642+00:00'
      line: 28
      excerpt: Estate/clone codes are globally unique; division/block codes are unique
        within an estate. Codes normalize to uppercase. Domain checks plus composite
        foreign keys enforce existing parents and matching estate relationships. Active
        blocks require positive area; inactive blocks permit zero. All areas are nonnegative
        with at most four decimal places. Counts are nonnegative and tappable never
        exceeds planted. IDs and creation timestamps stay stable; updates refresh
        timestamps and use JPA @Version plus request versions. Concurrent writes and
        database uniqueness constraints are tested. Future crop extensibility is isolated
        in CropType without adding crop features.
      outcome: null
