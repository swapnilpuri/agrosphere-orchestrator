  - id: 1C
    classification: PARTIAL
    confidence: medium
    objectives:
    - 'agrosphere-api-gateway/AGENTS.md:5: Current scope: Milestone 1C gateway integration:
      routing, JWT, CORS, correlation, timeouts, local rate limiting, observability
      and tests. No plantation business logic.'
    - 'agrosphere-architecture/AGENTS.md:5: Current scope: Architecture through requested
      Milestone 1C; document local integration decisions and actual validation. No
      service code here.'
    - 'agrosphere-architecture/README.md:3: Architecture and implementation decisions
      through Milestone 1C for the AgroSphere Rubber Plantation Digital Twin.'
    - 'agrosphere-architecture/README.md:26: Requested Milestone 1B spatial implementation
      is recorded in docs/adr/0009-spatial-digital-twin.md and docs/roadmap/MILESTONE_1B.md.
      Spatial Service targets Java 21 as explicitly requested; Estate retains its
      existing Java 25 build. Milestone 1C local integration is recorded in ADR-0010/0011
      and docs/roadmap/MILESTONE_1C.md.'
    - 'agrosphere-architecture/docs/adr/0010-local-platform-integration.md:3: Status:
      Accepted for the requested Milestone 1C implementation'
    - 'agrosphere-architecture/docs/architecture/INTEGRATION_PATTERNS.md:12: JWT issuer
      is configured without embedded secrets. Audience/estate-role enforcement and
      security regression tests are mandatory before domain routes. M1C implements
      gateway routing and a bounded per-process authenticated-subject limiter; ADR-0010
      records the local-only policy. OpenTelemetry spans use W3C trace context and
      correlation IDs without logging credentials.'
    - 'agrosphere-architecture/docs/architecture/INTEGRATION_PATTERNS.md:14: Milestone
      1A update: estate publishes EstateCreated, EstateUpdated and PlantationBlockCreated/Updated
      using v2 routing and full entity snapshots (ADR-0008). V1 schemas are preserved;
      other producers remain v1 foundation designs. The estate relay is now implemented
      and container-tested. Spatial implements its v2 consumer in M1B; M1C verifies
      it with the real Estate publisher. V2 requires occurredAt/sourceService and
      retains explicit provenance and UUID identities. Retry budgets, retained FAILED
      records, replay and disabled-publication operation are documented in Estate
      Service README.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONES.md:15: Milestone 1B is authorized
      by its separate request and implemented in Spatial Service; see MILESTONE_1B.md
      and ADR-0009. This does not authorize Milestone 1C.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONES.md:17: Milestone 1C local integration
      is implemented; see MILESTONE_1C.md, ADR-0010 and the infrastructure completion
      report for executed evidence. Client implementation remains future scope.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1C.md:3: Implemented in independent
      Infrastructure 0.2.0, Gateway 0.2.0, Estate 0.2.1 and Spatial 0.2.1 repositories.
      Architecture release 0.4.0 records ADRs 0010/0011; Contracts 0.3.1 documents
      compatibility with unchanged 0.3.0 schemas.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1C.md:5: The local apps profile
      integrates real Keycloak, RabbitMQ, isolated service databases/PostGIS, gateway
      routes/JWT/CORS/limits, health dependencies and Collector/Jaeger tracing. Automated
      shared-platform acceptance verifies canonical Estate/Spatial integration, trusted
      role/estate scope, actual API/event contracts, database isolation, duplicate
      event handling and service/broker outage recovery. Infrastructure README provides
      run commands and private environment initialization. See infrastructure docs/MILESTONE_1C_REPORT.md
      for actual results and limitations.'
    - 'agrosphere-architecture/docs/roadmap/MILESTONE_1C.md:7: Client implementation,
      authoritative division lifecycle, production deployment/identity/TLS, retained
      observability and performance/backup SLAs remain subsequent work. No remote
      publication or cloud resources were created.'
    - 'agrosphere-contracts/AGENTS.md:5: Current scope: Estate/Spatial contracts through
      Milestone 1C compatibility verification. Preserve existing schema bytes and
      version namespaces; tracing metadata belongs to transport, not a silent event-envelope
      change.'
    - 'agrosphere-estate-service/AGENTS.md:5: Current scope: Milestone 1A Estate plus
      requested Milestone 1C integration patches only; preserve all existing business
      rules, contracts and persistence ownership.'
    - 'agrosphere-estate-service/README.md:98: Milestone 1C additionally enables Rabbit
      producer/consumer observations and persists W3C transport context with atomic
      outbox rows, restoring it before confirmed publication. Event JSON is unchanged;
      old rows with null context remain publishable. The central acceptance suite
      asserts HTTP-to-relay-to-consumer trace continuity in Jaeger. JSON bodies are
      bounded to 2 MiB (including streamed bodies); infrastructure injects a distinct
      service field into structured logs. The full PKCE/two-division/ten-block canonical
      GeoJSON test and safe no-reset procedures are in infrastructure docs/INTEGRATION_TESTING.md
      and LOCAL_DEVELOPMENT.md.'
    - 'agrosphere-infrastructure/AGENTS.md:5: Current scope: Milestone 1C shared local
      infrastructure, identity, broker/tracing configuration and platform acceptance.
      Preserve service-owned migrations and independent application builds.'
    - 'agrosphere-infrastructure/CHANGELOG.md:11: Milestone 1C central Compose apps
      profile, real Keycloak/PKCE and trusted claims, broker topology, Collector/Jaeger,
      private environment setup, pinned contract acceptance/recovery tests and independent-image
      CI.'
    - 'agrosphere-infrastructure/README.md:95: Pinned response/event snapshots under
      tests/contracts are from contracts release 0.3.0 (Estate API/events retain 0.2.0
      semantics); SHA-256 manifest guards accidental drift. No runtime/build dependency
      reads sibling contracts. Each Java repository runs its own Maven/JWT/integration/contract
      checks. CI validates infrastructure and builds the two observability images.
      The manually dispatched platform workflow takes independently published application
      image references and runs acceptance without sibling checkouts. Registry images/remotes
      were not published or created here. See docs/MILESTONE_1C_REPORT.md for actual
      local results, baseline evidence, repository changes and limitations.'
    - "agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:3: Date: 2026-10-24 (America/Chicago).\
      \ Final scope: the complete requirements in the user's follow-up, including\
      \ sections 6\u201319. This report supersedes the earlier partial-attachment\
      \ report."
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:7: All sixteen definition-of-done
      criteria are implemented and locally verified. Gateway 0.2.0, Estate 0.2.1,
      Spatial 0.2.1 and infrastructure 0.2.0 run as independently built images. Architecture
      0.4.0 records integration decisions. Contracts 0.3.1 adds compatibility documentation
      only; API/event schema snapshots remain pinned to unchanged release 0.3.0 (Estate
      API/v2 semantics from 0.2.0). The stack remains running and healthy.'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:13: ## Preparation and
      implementation sequence'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:15: Read infrastructure
      AGENTS/README, all existing ADRs, architecture/requirements/diagrams, contracts
      and event versions, Estate/Spatial completion reports and implementation, gateway
      scaffold, environment/certificate inventory, service migrations, Compose/overlays
      and all affected CI workflows before modifying their repositories. No reusable
      local certificate files existed. Existing implementation was verified rather
      than assumed complete.'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:17: The initial inspection/plan
      selected reuse of isolated databases, existing outboxes/projection and compatible
      Gateway MVC. Baseline builds/contracts were recorded before configuration work.
      Implementation then connected identity, broker topology and gateway, added health-gated
      orchestration/HTTP tracing, executed initial integration and fixed discovered
      issues. When the full request arrived, it added real PKCE users, the exact ten-block
      GeoJSON scenario, durable outbox trace context, direct backend/request-size
      assertions, dedicated runbooks and full reporting. No business service was replaced
      or expanded beyond M1C.'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:19: | Baseline repository
      | Actually executed before implementation |'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:20: |---|---|'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:21: | Infrastructure
      | Existing all-profile Compose parse passed; existing seven-database/non-superuser
      bootstrap inspected |'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:22: | Gateway | Maven
      verify: 4 security tests passed |'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:23: | Estate | Maven
      verify: 38 unit/security tests; actual Java 25 integration: 9 PostgreSQL/RabbitMQ/HTTP/JWT
      cases passed |'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:24: | Spatial | Maven
      verify: 19 tests; actual Java 21 container integration: 12 PostGIS/RabbitMQ/HTTP/JWT
      cases passed |'
    - 'agrosphere-infrastructure/docs/MILESTONE_1C_REPORT.md:25: | Contracts | v1/v2/spatial
      schemas/examples/negative cases and OpenAPI validation passed |'
