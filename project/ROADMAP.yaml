        and TappingAssignmentCancelled. All use eventVersion=1, established timestamp/source/provenance
        metadata, aggregateId/version and stable eventId/correlationId. SIMULATED
        examples accompany every schema. Publish on agrosphere.domain with routing
        agrosphere.<eventType>.v1.
