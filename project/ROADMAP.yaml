    objectives:
    - 'agrosphere-architecture/docs/milestones/milestone-3a-discovery.md:5: Operations
      is Boot 4.0.9, Java 25, JUnit 5.14.4, Maven wrapper; only authenticated foundation
      routes, V1 outbox and processed-event tables exist. No tapping domain or relay
      exists. Estate has UUID REST master data, timezone, block estateId, scoped realm-role
      authorization, issuer/audience JWT validation and a confirmed outbox. Spatial
      has service-owned PostGIS migrations and Estate event projection. Gateway currently
      routes Estate and Spatial only. Infrastructure supplies isolated service databases,
      RabbitMQ topic exchange agrosphere.domain, Keycloak trusted estate_ids and realm_access.roles,
      apps profile and OTLP. Web is Angular/Cesium Milestone 2; remaining services
      are foundation scaffolds. Each repository retains independent build/deploy configuration.'
    - 'agrosphere-architecture/docs/requirements/NONFUNCTIONAL_REQUIREMENTS.md:9:
      | Visualization | Proposed 30 fps minimum on a named reference desktop; streaming/LOD
      and assets budget set in M2/M5 |'
    - 'agrosphere-architecture/docs/roadmap/IMPLEMENTATION_BACKLOG.md:13: | P1 M2-01
      | Cesium asset/worker pipeline, terrain and block selection | web | Licensing,
      provenance, IDs, source accuracy and performance measured |'
    - 'agrosphere-web/AGENTS.md:3: This independent Git repository implements Milestone
      2: Angular/CesiumJS browser digital twin. Preserve independent build, release,
      CI and Docker deployment. Do not create a parent repository, submodule, sibling
      runtime dependency, backend/BFF, shared persistence model, cloud deployment
      or new service endpoint.'
    - 'agrosphere-web/CHANGELOG.md:5: - Implement Angular Milestone 2 shell, guarded
      routing, Keycloak Code/PKCE session, memory token renewal and Gateway-only authorization.'
    - 'agrosphere-web/docs/INTEGRATION.md:27: - The web scaffold''s AGENTS scope was
      Milestone 0; the explicit Milestone 2 request supersedes it, and web instructions
      now reflect this implementation.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:3: Date: October 24, 2026 (America/Chicago).
      Web release: 0.2.0. Work is confined to agrosphere-web; backend source, API
      contracts in owning repositories, data ownership, and independent deployment
      remain intact. No Git commit/push, remote repository creation, cloud resource
      or Milestone 3 implementation was performed.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:5: ## A. Implementation summary'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:7: Implemented a standalone Angular
      enterprise shell with responsive/collapsible navigation, breadcrumbs, estate
      name/code search and canonical selection, authenticated user/logout controls,
      empty/loading/error/retry states and keyboard-accessible forms.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:15: Decisions follow the existing
      architecture: direct Cesium integration, local Signals plus RxJS cancellation,
      generated OpenAPI types and small adapters, shell-scoped data, runtime public
      configuration, no NgRx/BFF/backend coupling.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:21: - Estate GET /estates; /estates/{estateId}/divisions;
      /estates/{estateId}/blocks; /blocks/{id}.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:22: - Spatial GET /spatial/estates/{estateId}/features;
      /layers; /assets.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:23: - Typed adapters also expose
      current block geometry and POST point query; the viewer reuses loaded geometry
      to avoid redundant selection requests.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:31: Default terrain is the offline
      ellipsoid; imagery defaults to none. Runtime configuration supports custom imagery
      templates, custom terrain, optional scoped public ion tokens/world terrain and
      explicit attribution. Cesium attribution remains visible. Provider failures
      fall back to ellipsoid/no imagery; unavailable WebGL retains searchable metadata
      and details.'
    - 'agrosphere-web/docs/MILESTONE_2_REPORT.md:41: The existing agrosphere realm
      / agrosphere-web public client uses Authorization Code with PKCE S256, openid
      + agrosphere-api scopes, and issuer-administered roles/estate_ids. Tokens stay
      in adapter memory and renew before Gateway calls/on expiration. Direct login
      initializes the adapter; logout retains its ID-token end-session hint until
      redirect.'
