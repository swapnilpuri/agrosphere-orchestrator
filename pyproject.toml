[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrosphere-orchestrator"
version = "0.1.0"
description = "AgroSphere engineering orchestration foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "typer>=0.15,<1"]

[project.optional-dependencies]
codex = ["openai-agents==0.24.0"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
aeo = "agrosphere_orchestrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["docs/milestones/**"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
